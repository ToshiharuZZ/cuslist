{% extends "base.html" %}

{% block title %}
{% if action == 'new' %}顧客登録{% else %}顧客編集{% endif %} - 顧客リスト管理システム
{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{% if action == 'new' %}➕ 顧客登録{% else %}✏️ 顧客編集{% endif %}</h1>
    <a href="{{ url_for('customer.customer_list') }}" class="btn btn-secondary">一覧に戻る</a>
</div>

<div class="card">
    <form method="POST" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="name">顧客名 <span class="required">*</span></label>
            <input type="text" id="name" name="name" required value="{{ customer.name if customer else '' }}"
                placeholder="例: 山田 太郎" maxlength="100">
        </div>

        <div class="form-group">
            <label for="address">住所</label>
            <input type="text" id="address" name="address" value="{{ customer.address if customer else '' }}"
                placeholder="例: 東京都渋谷区..." maxlength="255">
        </div>

        <div class="form-group">
            <label for="phone">電話番号</label>
            <input type="tel" id="phone" name="phone" value="{{ customer.phone if customer else '' }}"
                placeholder="例: 03-1234-5678" maxlength="20">
        </div>

        <div class="form-group">
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" value="{{ customer.email if customer else '' }}"
                placeholder="例: yamada@example.com" maxlength="255">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                {% if action == 'new' %}登録{% else %}更新{% endif %}
            </button>
            <a href="{{ url_for('customer.customer_list') }}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}利用者登録 - 顧客リスト管理システム{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ 利用者登録</h1>
    <a href="{{ url_for('auth.user_list') }}" class="btn btn-secondary">一覧に戻る</a>
</div>

<div class="card">
    <form method="POST" action="{{ url_for('auth.register_user') }}" class="form">
        <div class="form-group">
            <label for="user_id">利用者ID <span class="required">*</span></label>
            <input type="text" id="user_id" name="user_id" required placeholder="例: user001" maxlength="50">
        </div>

        <div class="form-group">
            <label for="password">パスワード <span class="required">*</span></label>
            <input type="password" id="password" name="password" required placeholder="8文字以上推奨" minlength="4">
        </div>

        <div class="form-group">
            <label for="role">権限</label>
            <select id="role" name="role">
                <option value="user">一般ユーザー</option>
                <option value="admin">管理者</option>
            </select>
        </div>

        <div class="form-group">
            <label for="plan">契約プラン</label>
            <select id="plan" name="plan">
                <option value="Basic">Basic (月額¥500)</option>
                <option value="Standard">Standard (月額¥1,500)</option>
                <option value="Premium">Premium (月額¥3,000)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="billing_type">課金方式</label>
            <select id="billing_type" name="billing_type">
                <option value="subscription">サブスクリプション</option>
                <option value="usage">従量課金</option>
                <option value="transaction">トランザクション課金</option>
                <option value="hybrid">ハイブリッド</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">登録</button>
            <a href="{{ url_for('auth.user_list') }}" class="btn btn-secondary">キャンセル</a>
        </div>
    </form>
</div>
{% endblock %}

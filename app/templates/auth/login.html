{% extends "base.html" %}

{% block title %}ログイン - 顧客リスト管理システム{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">🔐 ログイン</h1>
        <p class="login-subtitle">顧客リスト管理システムへようこそ</p>

        <form method="POST" action="{{ url_for('auth.login') }}" class="login-form">
            <div class="form-group">
                <label for="user_id">利用者ID</label>
                <input type="text" id="user_id" name="user_id" required placeholder="利用者IDを入力" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" required placeholder="パスワードを入力"
                    autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">ログイン</button>
        </form>
    </div>
</div>
{% endblock %}
